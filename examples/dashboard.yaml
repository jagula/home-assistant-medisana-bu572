title: Medisana BU 572
views:
  - title: Blutdruck
    path: medisana-bu572
    icon: mdi:heart-pulse
    cards:
      - type: entities
        title: BU 572
        show_header_toggle: false
        entities:
          - entity: input_number.bu_572_anzahl_letzte_messungen
            name: Anzahl letzter Messungen
          - entity: sensor.medisana_bu_572_batterie
            name: Batterie
          - entity: sensor.medisana_bu_572_letzter_benutzer
            name: Letzter Benutzer
          - entity: sensor.medisana_bu_572_bluetooth_rssi
            name: Bluetooth RSSI

      - type: vertical-stack
        cards:
          - type: markdown
            title: Benutzer 1 – letzte Messung
            content: |
              {% set sys = states('sensor.medisana_bu_572_benutzer_1_systolisch') %}
              {% set dia = states('sensor.medisana_bu_572_benutzer_1_diastolisch') %}
              {% set map = states('sensor.medisana_bu_572_benutzer_1_mittlerer_arterieller_druck') %}
              {% set pulse = states('sensor.medisana_bu_572_benutzer_1_puls') %}
              {% set t = states('sensor.medisana_bu_572_benutzer_1_messzeit') %}
              ## {{ sys }} / {{ dia }} mmHg
              **MAP:** {{ map }} mmHg · **Puls:** {{ pulse }} bpm

              **Messzeit:** {{ as_timestamp(t) | timestamp_custom('%d.%m.%Y %H:%M', true) if t not in ['unknown','unavailable','none',''] else 'nicht verfügbar' }}

          - type: entities
            title: Benutzer 1
            show_header_toggle: false
            entities:
              - entity: sensor.medisana_bu_572_benutzer_1_systolisch
                name: Systolisch
              - entity: sensor.medisana_bu_572_benutzer_1_diastolisch
                name: Diastolisch
              - entity: sensor.medisana_bu_572_benutzer_1_mittlerer_arterieller_druck
                name: MAP
              - entity: sensor.medisana_bu_572_benutzer_1_puls
                name: Puls
              - entity: sensor.medisana_bu_572_benutzer_1_messzeit
                name: Messzeit
              - entity: sensor.medisana_bu_572_benutzer_1_messhistorie
                name: Gespeicherte Messungen
              - entity: sensor.medisana_bu_572_benutzer_1_importierte_altmessungen
                name: Importierte Altmessungen

          - type: history-graph
            title: Benutzer 1 – Blutdruckverlauf
            hours_to_show: 168
            entities:
              - entity: sensor.medisana_bu_572_benutzer_1_systolisch
                name: SYS
              - entity: sensor.medisana_bu_572_benutzer_1_diastolisch
                name: DIA
              - entity: sensor.medisana_bu_572_benutzer_1_mittlerer_arterieller_druck
                name: MAP

          - type: history-graph
            title: Benutzer 1 – Puls
            hours_to_show: 168
            entities:
              - entity: sensor.medisana_bu_572_benutzer_1_puls
                name: Puls

          - type: markdown
            title: Benutzer 1 – letzte Messungen
            content: |
              {% set n = states('input_number.bu_572_anzahl_letzte_messungen') | int(10) %}
              {% set h = state_attr('sensor.medisana_bu_572_benutzer_1_messhistorie', 'measurements') or [] %}
              | Zeit | SYS | DIA | MAP | Puls |
              |:--|--:|--:|--:|--:|
              {% for m in h[:n] %}
              | {{ as_timestamp(m.measurement_time) | timestamp_custom('%d.%m.%Y %H:%M', true) if m.measurement_time else '–' }} | {{ m.systolic }} | {{ m.diastolic }} | {{ m.map }} | {{ m.pulse if m.pulse is not none else '–' }} |
              {% endfor %}
              {% if h | length == 0 %}
              | – | – | – | – | – |
              {% endif %}

      - type: vertical-stack
        cards:
          - type: markdown
            title: Benutzer 2 – letzte Messung
            content: |
              {% set sys = states('sensor.medisana_bu_572_benutzer_2_systolisch') %}
              {% set dia = states('sensor.medisana_bu_572_benutzer_2_diastolisch') %}
              {% set map = states('sensor.medisana_bu_572_benutzer_2_mittlerer_arterieller_druck') %}
              {% set pulse = states('sensor.medisana_bu_572_benutzer_2_puls') %}
              {% set t = states('sensor.medisana_bu_572_benutzer_2_messzeit') %}
              ## {{ sys }} / {{ dia }} mmHg
              **MAP:** {{ map }} mmHg · **Puls:** {{ pulse }} bpm

              **Messzeit:** {{ as_timestamp(t) | timestamp_custom('%d.%m.%Y %H:%M', true) if t not in ['unknown','unavailable','none',''] else 'nicht verfügbar' }}

          - type: entities
            title: Benutzer 2
            show_header_toggle: false
            entities:
              - entity: sensor.medisana_bu_572_benutzer_2_systolisch
                name: Systolisch
              - entity: sensor.medisana_bu_572_benutzer_2_diastolisch
                name: Diastolisch
              - entity: sensor.medisana_bu_572_benutzer_2_mittlerer_arterieller_druck
                name: MAP
              - entity: sensor.medisana_bu_572_benutzer_2_puls
                name: Puls
              - entity: sensor.medisana_bu_572_benutzer_2_messzeit
                name: Messzeit
              - entity: sensor.medisana_bu_572_benutzer_2_messhistorie
                name: Gespeicherte Messungen

          - type: history-graph
            title: Benutzer 2 – Blutdruckverlauf
            hours_to_show: 168
            entities:
              - entity: sensor.medisana_bu_572_benutzer_2_systolisch
                name: SYS
              - entity: sensor.medisana_bu_572_benutzer_2_diastolisch
                name: DIA
              - entity: sensor.medisana_bu_572_benutzer_2_mittlerer_arterieller_druck
                name: MAP

          - type: history-graph
            title: Benutzer 2 – Puls
            hours_to_show: 168
            entities:
              - entity: sensor.medisana_bu_572_benutzer_2_puls
                name: Puls

          - type: markdown
            title: Benutzer 2 – letzte Messungen
            content: |
              {% set n = states('input_number.bu_572_anzahl_letzte_messungen') | int(10) %}
              {% set h = state_attr('sensor.medisana_bu_572_benutzer_2_messhistorie', 'measurements') or [] %}
              | Zeit | SYS | DIA | MAP | Puls |
              |:--|--:|--:|--:|--:|
              {% for m in h[:n] %}
              | {{ as_timestamp(m.measurement_time) | timestamp_custom('%d.%m.%Y %H:%M', true) if m.measurement_time else '–' }} | {{ m.systolic }} | {{ m.diastolic }} | {{ m.map }} | {{ m.pulse if m.pulse is not none else '–' }} |
              {% endfor %}
              {% if h | length == 0 %}
              | – | – | – | – | – |
              {% endif %}
